name: Build LRDMS APK

on:
  push:
    branches: [ lrdms-apk-build-v4 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 15859902
          packages: platform-tools
      - name: Install current Android CLI
        shell: bash
        run: |
          curl -fsSL https://dl.google.com/android/cli/latest/linux_x86_64/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/android" --version
      - name: Install Android 17 SDK
        shell: bash
        run: |
          android --sdk="$ANDROID_HOME" sdk install --canary platforms/android-37.0 build-tools/37.0.0
          android --sdk="$ANDROID_HOME" sdk list 'platforms/android-37.0|build-tools/37.0.0' --all --canary
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk LRDMS.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LRDMS-APK
          path: LRDMS.apk
          if-no-files-found: error
